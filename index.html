<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eberron Interactive Map</title>
  <meta name="description" content="Mappa interattiva di Eberron: cerca luoghi, segna la tua campagna, misura distanze e tempi di viaggio." />
  <meta name="theme-color" content="#0c2233" />

  <link rel="preload" href="assets/fonts/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/leaflet.css" />
  <link rel="stylesheet" href="assets/map.css" />
  <script src="assets/leaflet.js"></script>
  <script src="assets/map.js" defer></script>
</head>
<body>
  <main class="app">
    <div id="map" aria-label="Mappa di Eberron"></div>

    <!-- Ricerca -->
    <div id="searchBox" class="search">
      <div class="search__bar">
        <h1 class="search__brand">Eberron</h1>
        <label for="searchInput" class="visually-hidden">Cerca un luogo o un marker</label>
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
        <input id="searchInput" class="search__input" type="search" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Cerca luoghi e marker" />
      </div>
      <ul id="searchResults" class="search__results" role="listbox" aria-label="Risultati della ricerca" hidden></ul>
    </div>

    <!-- Pannello unico: marker, livelli, misura -->
    <section id="sheet" class="sheet" aria-labelledby="sheetTitle" hidden>
      <header class="sheet__header">
        <h2 id="sheetTitle" class="sheet__title"></h2>
        <button id="sheetClose" class="icon-btn" type="button" aria-label="Chiudi pannello">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
        </button>
      </header>
      <div id="sheetBody" class="sheet__body"></div>
    </section>

    <!-- Avviso mentre si posiziona un marker -->
    <div id="placing" class="banner" role="status" hidden>
      <span id="placingText"></span>
      <button id="placingCancel" class="btn btn--quiet" type="button">Annulla</button>
    </div>

    <!-- Notifiche -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- Scala -->
    <div id="scale" class="scale" aria-hidden="true">
      <span id="scaleLabel" class="scale__label"></span>
      <span id="scaleBar" class="scale__bar"></span>
    </div>

    <!-- Strumenti -->
    <nav class="dock" aria-label="Strumenti della mappa">
      <button class="dock__btn" type="button" data-tool="markers" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span>Marker</span>
      </button>
      <button class="dock__btn" type="button" data-tool="measure" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7 17 17 7" stroke-dasharray="2.5 3"/></svg>
        <span>Misura</span>
      </button>
      <button class="dock__btn" type="button" data-tool="layers" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 8.5 4.5L12 13 3.5 8.5 12 4Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg>
        <span>Livelli</span>
      </button>
      <button class="dock__btn" type="button" id="copyLink">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
        <span>Copia link</span>
      </button>
    </nav>

    <input id="importFile" type="file" accept="application/json,.json" hidden />
  </main>
</body>
</html>
